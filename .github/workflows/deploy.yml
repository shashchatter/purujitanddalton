name: Deploy to Interserver

# On every push to main, upload the site over FTPS to the addon domain's
# document root. Only changed files are sent; files that exist only on the
# server (e.g. uploads/) are left alone.
#
# (cPanel's API on :2083 can't be used from Actions: the server's bot check
# answers GitHub's runners with a "One moment, please..." page.)
#
# Repo secrets:   FTP_USERNAME    cPanel FTP account, e.g. purujitanddalton@thechatterjees.net
#                 FTP_PASSWORD    its password
# Repo variable:  FTP_SERVER_DIR  optional; path relative to the FTP account's home.
#                 Default "./" assumes the account's directory is the document root
#                 (/home/shashchatter/purujitanddalton).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        id: check
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::notice::FTP secrets not set yet; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - name: Upload over FTPS
        if: steps.check.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: webhosting2017.is.cc
          protocol: ftps
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .cpanel.yml
            README.md
