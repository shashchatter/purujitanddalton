name: Deploy to Interserver

# On every push to main, upload the site over FTPS (lftp) to the addon domain's
# document root. Nothing is deleted on the server, so files that exist only
# there (e.g. uploads/) are left alone.
#
# (cPanel's API on :2083 can't be used from Actions: the server's bot check
# answers GitHub's runners with a "One moment, please..." page.)
#
# Repo secrets:   FTP_USERNAME    cPanel FTP account, e.g. purujitanddalton@thechatterjees.net
#                 FTP_PASSWORD    its password
# Repo variable:  FTP_SERVER_DIR  optional; path relative to the FTP account's home.
#                 Default "./" assumes the account's directory is the document root
#                 (~/purujitanddalton).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        id: check
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::notice::FTP secrets not set yet; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      # lftp rather than an FTP action: the server's ProFTPD requires TLS session
      # reuse on data connections, which node-based FTP clients don't do.
      - name: Upload over FTPS
        if: steps.check.outputs.ready == 'true'
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SERVER_DIR: ${{ vars.FTP_SERVER_DIR || './' }}
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq lftp >/dev/null

          # The server sends only its leaf certificate. Follow the AIA issuer links
          # until the chain verifies against the system roots, then trust that bundle.
          HOST=webhosting2017.is.cc
          SYS=/etc/ssl/certs/ca-certificates.crt
          openssl s_client -starttls ftp -connect "$HOST:21" -servername "$HOST" </dev/null 2>/dev/null \
            | openssl x509 > "$RUNNER_TEMP/leaf.pem"
          : > "$RUNNER_TEMP/chain.pem"
          cur=$RUNNER_TEMP/leaf.pem
          for _ in 1 2 3; do
            if openssl verify -CAfile "$SYS" -untrusted "$RUNNER_TEMP/chain.pem" -verify_hostname "$HOST" "$RUNNER_TEMP/leaf.pem" >/dev/null 2>&1; then
              break
            fi
            url=$(openssl x509 -in "$cur" -noout -ext authorityInfoAccess | sed -n 's/.*CA Issuers - URI://p' | head -1)
            [ -n "$url" ] || break
            curl -fsS "$url" | openssl x509 -inform der > "$RUNNER_TEMP/next.pem"
            cat "$RUNNER_TEMP/next.pem" >> "$RUNNER_TEMP/chain.pem"
            cur=$RUNNER_TEMP/next.pem
          done
          openssl verify -CAfile "$SYS" -untrusted "$RUNNER_TEMP/chain.pem" -verify_hostname "$HOST" "$RUNNER_TEMP/leaf.pem"
          cat "$SYS" "$RUNNER_TEMP/chain.pem" > "$RUNNER_TEMP/ca.pem"

          lftp -c "
            set cmd:fail-exit true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            set ssl:ca-file $RUNNER_TEMP/ca.pem;
            set net:max-retries 3;
            set net:timeout 30;
            open --env-password -u \"$FTP_USERNAME\" $HOST;
            mirror --reverse --verbose --parallel=4 \
              --exclude '^\.git' --exclude '^\.cpanel\.yml$' --exclude '^README\.md$' \
              ./ \"$SERVER_DIR\""
